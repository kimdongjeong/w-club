<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 배경 원 (그린) -->
  <circle cx="256" cy="256" r="256" fill="#00B894"/>

  <!-- 축구공 흰 바탕 원 -->
  <circle cx="256" cy="256" r="210" fill="#ffffff"/>

  <!-- 축구공 오각형 패턴 (검정) -->
  <!-- 중앙 오각형 -->
  <polygon points="256,160 303,193 285,248 227,248 209,193" fill="#1a1a1a"/>

  <!-- 상단 -->
  <polygon points="256,88 290,112 303,193 256,160 209,193 222,112" fill="#1a1a1a" opacity="0.15"/>

  <!-- 우상단 -->
  <polygon points="340,122 370,160 355,210 303,193 290,112" fill="#1a1a1a" opacity="0.15"/>

  <!-- 우하단 -->
  <polygon points="370,160 390,230 355,280 320,265 303,193 355,210" fill="#1a1a1a" opacity="0.15"/>

  <!-- 하단 우 -->
  <polygon points="355,280 340,340 285,350 285,248 303,193 320,265" fill="#1a1a1a" opacity="0.15"/>

  <!-- 하단 좌 -->
  <polygon points="227,248 209,193 192,265 172,280 227,350 227,248" fill="#1a1a1a" opacity="0.15"/>

  <!-- 좌하단 -->
  <polygon points="192,265 156,280 122,230 142,160 209,193 192,265" fill="#1a1a1a" opacity="0.15"/>

  <!-- 좌상단 -->
  <polygon points="209,193 222,112 172,160 142,160 156,210 192,265" fill="#1a1a1a" opacity="0.0"/>

  <!-- 축구공 외곽 테두리 -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1a1a1a" stroke-width="8"/>

  <!-- 축구공 패턴 선들 -->
  <line x1="256" y1="46" x2="256" y2="160" stroke="#1a1a1a" stroke-width="4" opacity="0.3"/>
  <line x1="303" y1="193" x2="380" y2="140" stroke="#1a1a1a" stroke-width="4" opacity="0.3"/>
  <line x1="285" y1="248" x2="380" y2="290" stroke="#1a1a1a" stroke-width="4" opacity="0.3"/>
  <line x1="227" y1="248" x2="132" y2="290" stroke="#1a1a1a" stroke-width="4" opacity="0.3"/>
  <line x1="209" y1="193" x2="132" y2="140" stroke="#1a1a1a" stroke-width="4" opacity="0.3"/>
  <line x1="285" y1="248" x2="256" y2="350" stroke="#1a1a1a" stroke-width="4" opacity="0.3"/>
  <line x1="227" y1="248" x2="256" y2="350" stroke="#1a1a1a" stroke-width="4" opacity="0.3"/>

  <!-- 중앙 오각형 테두리 -->
  <polygon points="256,160 303,193 285,248 227,248 209,193" fill="none" stroke="#1a1a1a" stroke-width="5"/>

  <!-- W 글자 (흰색, 굵게) -->
  <text x="256" y="232" 
        font-family="Arial Black, Arial, sans-serif" 
        font-size="88" 
        font-weight="900"
        fill="#ffffff" 
        text-anchor="middle" 
        dominant-baseline="middle"
        letter-spacing="-4"
        style="text-shadow: 0 2px 8px rgba(0,0,0,0.4)">W</text>

  <!-- W 글자 외곽선 (선명하게) -->
  <text x="256" y="232" 
        font-family="Arial Black, Arial, sans-serif" 
        font-size="88" 
        font-weight="900"
        fill="none"
        stroke="#00B894"
        stroke-width="3"
        text-anchor="middle" 
        dominant-baseline="middle"
        letter-spacing="-4">W</text>

  <!-- 하단 클럽 텍스트 -->
  <text x="256" y="360"
        font-family="Arial, sans-serif"
        font-size="36"
        font-weight="700"
        fill="#1a1a1a"
        text-anchor="middle"
        dominant-baseline="middle"
        letter-spacing="6">CLUB</text>

  <!-- 외곽 테두리 원 -->
  <circle cx="256" cy="256" r="250" fill="none" stroke="#00B894" stroke-width="12"/>
</svg>
